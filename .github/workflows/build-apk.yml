name: Build & Release Nova Calculator APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Android APK (RV Group LTD)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Verify Permanent Release Keystore
        run: |
          mkdir -p keystore
          if [ -f keystore/nova-release.jks ]; then
            echo "Permanent committed keystore/nova-release.jks verified! Using constant signing certificate."
          else
            echo "Generating fallback keystore..."
            keytool -genkeypair -v \
              -keystore keystore/nova-release.jks \
              -alias nova_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass rvgroup123 \
              -keypass rvgroup123 \
              -dname "CN=Pankaj, OU=RV Group LTD, O=RV Group LTD, L=Mumbai, ST=Maharashtra, C=IN"
          fi

      - name: Build Signed Release & Debug APKs
        run: |
          gradle assembleRelease assembleDebug --stacktrace
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk release-output/Nova-Calculator-v2.1.0-RV-Group.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-output/Nova-Calculator-Debug.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Calculator-APK
          path: release-output/*.apk

      - name: Publish Signed APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: "Nova Calculator v2.1.0 — RV Group LTD | ♥️ BY PANKAJ"
          body: |
            ### ✦ Nova Calculator (Android APK Release)
            **— powered by RV GROUP —**  
            **RV Group LTD | ♥️ BY PANKAJ**

            #### 📥 Direct APK Download
            Neeche **Assets** section mein **`Nova-Calculator-v2.1.0-RV-Group.apk`** par tap karke download aur install karein.

            > ⚠️ **Note**: Agar aapke phone mein purana test version pehle se installed tha, to pehle use phone se **Uninstall (Delete)** karein, fir ye naya build install karein. Is build mein permanent release keystore embed kar diya gaya hai, iske baad aage ke **saare future updates bina uninstall kiye direct update** hote rahenge!

            #### ✨ Highlights
            - **Fixed Calculation Engine**: `vibrate` ReferenceError bug fixed, all operations snappy & responsive.
            - **Built-in Financial Tools**: India GST/Tax Calculator, Loan & EMI Calculator, and Cash Counter.
            - **Direct Social Sharing**: 1-tap WhatsApp, Telegram, X, Facebook, and SMS calculation card share.
            - **In-App Auto-Updater**: Direct in-app update notifications and 1-tap APK update download.
          files: |
            release-output/Nova-Calculator-v2.1.0-RV-Group.apk
            release-output/Nova-Calculator-Debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
